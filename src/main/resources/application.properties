server.port=${APP_PORT:8080}
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:threattrace}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${MYSQL_USER:threattrace}
spring.datasource.password=${MYSQL_PASSWORD:threattrace-local}
spring.sql.init.mode=never
spring.jackson.serialization.write-dates-as-timestamps=false
analytics.url=${ANALYTICS_URL:http://localhost:8100}
threattrace.pseudonym-key=${THREATTRACE_PSEUDONYM_KEY:threattrace-synthetic-demo-key}
