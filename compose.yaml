services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-threattrace-local}
      MYSQL_DATABASE: threattrace
      MYSQL_USER: threattrace
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-threattrace-local}
    ports: ["3306:3306"]
    volumes:
      - threattrace_mysql:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "threattrace", "-p${MYSQL_PASSWORD:-threattrace-local}"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  threattrace_mysql:
